name: "Tests (External)"

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest

    if: github.event.label.name == 'test'

    strategy:
      fail-fast: false
      matrix:
        adapter: [gitea, forgejo, github, gitlab, gogs]

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Start Test Stack
      env:
          TESTS_GITHUB_PRIVATE_KEY: ${{ secrets.TESTS_GITHUB_PRIVATE_KEY }}
          TESTS_GITHUB_APP_IDENTIFIER: ${{ secrets.TESTS_GITHUB_APP_IDENTIFIER }}
          TESTS_GITHUB_INSTALLATION_ID: ${{ secrets.TESTS_GITHUB_INSTALLATION_ID }}
      run: |
        docker compose --profile ${{ matrix.adapter }} up -d --wait --wait-timeout 900

    - name: Doctor
      run: |
        docker compose --profile ${{ matrix.adapter }} logs
        docker ps
        docker network ls

    - name: Run Tests
      run: |
        docker compose exec -T tests vendor/bin/phpunit --configuration phpunit.xml --testsuite ${{ matrix.adapter }}

    - name: GitLab internal status
      # Runs whether or not the tests passed, so a GitLab connection failure
      # mid-run leaves a record of which internal process was down at that point.
      if: always() && matrix.adapter == 'gitlab'
      run: |
        docker compose exec -T gitlab gitlab-ctl status || true

    - name: GitLab webhook delivery diagnostics
      # Only on an actual failure: shows whether GitLab attempted the
      # delivery at all (sidekiq's own log) and whether it ever reached the
      # catcher, so a webhook timeout has an actual cause next time instead
      # of another guess.
      if: failure() && matrix.adapter == 'gitlab'
      run: |
        echo "--- WebHookWorker jobs (sidekiq log) ---"
        docker compose exec -T gitlab grep -h 'WebHookWorker' /var/log/gitlab/sidekiq/current || echo "no WebHookWorker entries found"
        echo "--- request-catcher log ---"
        docker compose logs --tail 100 request-catcher || true
