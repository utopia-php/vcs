name: "Tests"

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        adapter: [gitea, forgejo, github, gitlab, gogs]

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Start Test Stack
      env:
          TESTS_GITHUB_PRIVATE_KEY: ${{ secrets.TESTS_GITHUB_PRIVATE_KEY }}
          TESTS_GITHUB_APP_IDENTIFIER: ${{ secrets.TESTS_GITHUB_APP_IDENTIFIER }}
          TESTS_GITHUB_INSTALLATION_ID: ${{ secrets.TESTS_GITHUB_INSTALLATION_ID }}
      run: |
        docker compose --profile ${{ matrix.adapter }} up -d --wait --wait-timeout 900

    - name: Doctor
      run: |
        docker compose --profile ${{ matrix.adapter }} logs
        docker ps
        docker network ls

    - name: Run Tests
      id: run_tests
      run: |
        docker compose exec -T tests vendor/bin/phpunit --configuration phpunit.xml --testsuite ${{ matrix.adapter }}

    - name: GitLab diagnostics
      # Always shows internal service status, so a connection failure mid-run
      # leaves a record of what was down at that point. On an actual test
      # failure it also dumps webhook delivery activity, so a timeout has an
      # actual cause next time instead of another guess. Detects GitLab by
      # whether its container exists rather than the adapter name, so it
      # doesn't need updating if adapters are renamed or added.
      if: always()
      run: |
        container=$(docker compose ps -q --status=running gitlab || true)
        if [ -z "$container" ]; then
          exit 0
        fi

        echo "--- gitlab-ctl status ---"
        docker compose exec -T gitlab gitlab-ctl status || true

        if [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
          echo "--- WebHookWorker jobs (sidekiq log) ---"
          docker compose exec -T gitlab grep -h 'WebHookWorker' /var/log/gitlab/sidekiq/current || echo "no WebHookWorker entries found"
          echo "--- request-catcher log ---"
          docker compose logs --tail 100 request-catcher || true
        fi
